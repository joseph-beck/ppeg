stages:
  - check
  - build
  - test
  - reports

# rust images are out of date.
# here the latest rust toolchain is installed manually.
.rust:
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH=$HOME/.cargo/bin:$PATH
    - rustup --version
    - rustc --version
    - cargo --version

# install pnpm package manager.
.pnpm:
  image: node:20
  before_script:
    - curl -fsSL https://get.pnpm.io/install.sh | sh -
    - export PNPM_HOME=/opt/gitlab-runner/.local/share/pnpm
    - export PATH=$PNPM_HOME:$PATH
    - pnpm --version

# adds sonar-scanner to path to be used in the check:sonar job.
.sonar:
  before_script:
    - export SONAR_SCANNER_VERSION=7.2.0.5079
    - export SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64
    - curl --create-dirs -sSLo $HOME/.sonar/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
    - unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
    - export PATH=$SONAR_SCANNER_HOME/bin:$PATH

# sonar job, runs the sonar-scanner.
check:sonar:
  extends: .sonar
  stage: check
  script:
    - sonar-scanner

# linting with clippy.
check:lint-rs:
  extends: .rust
  stage: check
  script:
    - rustup component add clippy
    - "cargo clippy
      --color always
      --verbose
      --all-targets
      --all-features"

# formatting check with rustfmt.
check:fmt-rs:
  extends: .rust
  stage: check
  script:
    - rustup component add rustfmt
    - "cargo fmt
      --check
      --verbose"

# lint the ui with eslint.
check:lint-ui:
  extends: .pnpm
  stage: check
  script:
    - cd ppeg-ui
    - pnpm install
    - pnpm run lint

# formatting check with prettier.
check:fmt-ui:
  extends: .pnpm
  stage: check
  script:
    - cd ppeg-ui
    - pnpm install
    - pnpm run fmt

# test build, verbosely, with cargo.
build:build-rs:
  extends: .rust
  stage: build
  script:
    - "cargo build
      --color always
      --verbose"

# build the ui.
build:build-ui:
  extends:
    - .rust
    - .pnpm
  stage: build
  script:
    - cargo install wasm-pack
    - cd ppeg-ui
    - pnpm install
    - pnpm run build

# test run, verbosely, with cargo.
test:test-rs:
  extends: .rust
  stage: test
  script:
    - "cargo test
      --color always
      --verbose
      --all-features
      --all-targets"

# test the ui.
test:test-ui:
  extends:
    - .rust
    - .pnpm
  stage: test
  script:
    - cargo install wasm-pack
    - cd ppeg-ui
    - pnpm install
    - pnpm run test

# generate rustdoc, goes to target/doc.
# stored as artifact for later.
reports:docs:
  extends: .rust
  stage: reports
  script:
    - "cargo doc"
  artifacts:
    paths:
      - target/doc

# generate criterion benchmark results, goes to target/criterion.
# stored as artifact for later.
reports:bench:
  extends: .rust
  stage: reports
  script:
    - "cargo bench"
  artifacts:
    paths:
      - target/criterion
